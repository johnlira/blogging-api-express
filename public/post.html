<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Post</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 60px 20px;
        line-height: 1.8;
        color: #1a1a1a;
      }
      .back-link {
        display: block;
        margin-bottom: 40px;
        color: #666;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back-link:hover { text-decoration: underline; }
      h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.02em; }
      .meta { color: #666; font-size: 0.95rem; margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
      .content { font-size: 1.1rem; }
      .tag { background: #f0f0f0; padding: 2px 10px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; }
    </style>
  </head>
  <body>
    <a href="/" class="back-link">← Back to home</a>
    <div id="post-content">
      <div id="loading">Loading post...</div>
    </div>

    <script>
      async function fetchPost() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        if (!id) {
          window.location.href = '/';
          return;
        }

        try {
          const response = await fetch(`/api/posts/${id}`);
          const data = await response.json();
          const container = document.getElementById("post-content");

          if (data.post) {
            const post = data.post;
            container.innerHTML = `
              <h1>${post.title}</h1>
              <div class="meta">
                <span>${post.category}</span> • 
                <span>${new Date(post.created_at).toLocaleDateString()}</span>
              </div>
              <div class="content">
                ${post.content.replace(/\n/g, '<br>')}
              </div>
              <div style="margin-top: 40px;">
                ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
              </div>
            `;
          } else {
            container.innerHTML = '<h1>Post not found.</h1>';
          }
        } catch (error) {
          document.getElementById("post-content").innerHTML = '<h1>Error loading post.</h1>';
        }
      }
      document.addEventListener("DOMContentLoaded", fetchPost);
    </script>
  </body>
</html>
