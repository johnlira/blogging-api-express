<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogging API Viewer</title>
    <style>
      :root {
        --text-main: #1a1a1a;
        --text-sub: #666;
        --bg: #ffffff;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 60px 20px;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.6;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 40px;
        letter-spacing: -0.02em;
      }
      .section-title {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-sub);
        margin: 40px 0 20px 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
      }
      .post-item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
        text-decoration: none;
        color: inherit;
        transition: opacity 0.2s;
      }
      .post-item:hover {
        opacity: 0.6;
      }
      .post-info h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }
      .post-info p {
        margin: 4px 0 0 0;
        color: var(--text-sub);
        font-size: 0.95rem;
      }
      .post-date {
        font-size: 0.9rem;
        color: var(--text-sub);
        white-space: nowrap;
        margin-left: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Blogging API Viewer</h1>

    <h2 class="section-title">Latest Posts</h2>
    <div id="loading">Loading posts...</div>
    <div id="posts-container"></div>

    <script>
      async function fetchPosts() {
        try {
          const response = await fetch("/api/posts");
          const data = await response.json();
          const container = document.getElementById("posts-container");
          const loading = document.getElementById("loading");

          loading.style.display = "none";

          if (data.posts && data.posts.length > 0) {
            data.posts.forEach((post) => {
              const year = new Date(post.created_at).getFullYear();
              const postLink = document.createElement("a");
              postLink.className = "post-item";
              postLink.href = `/post.html?id=${post.id}`;
              postLink.innerHTML = `
                <div class="post-info">
                  <h3>${post.title}</h3>
                  <p>${post.category}</p>
                </div>
                <div class="post-date">${year}</div>
              `;
              container.appendChild(postLink);
            });
          } else {
            container.innerHTML = '<p>No posts found.</p>';
          }
        } catch (error) {
          console.error("Error fetching posts:", error);
          document.getElementById("loading").innerText = "Error loading posts.";
        }
      }

      document.addEventListener("DOMContentLoaded", fetchPosts);
    </script>
  </body>
</html>
